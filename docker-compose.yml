services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    environment:
      - DB_PATH=/app/data/app.db
      - PORT=8081
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    networks:
      - social-network
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - social-network
    restart: unless-stopped

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local

networks:
  social-network:
    driver: bridge
