services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - backend-data:/app/data
      - backend-uploads:/app/uploads
    environment:
      - DB_PATH=/app/data/app.db
    networks:
      - social-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - social-network

volumes:
  backend-data:
    driver: local
  backend-uploads:
    driver: local

networks:
  social-network:
    driver: bridge
